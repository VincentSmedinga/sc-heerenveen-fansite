# Checks that the pull request title follows Conventional Commits. A squash merge makes the title the commit on main,
# and release-please builds the version number and the changelog from those commits.

name: PR title

on:
  pull_request:
    # Also when the title changes, and on every push, so the check is there for the latest commit.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  commitlint:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # The title goes through an environment variable, so it's never run as part of the script.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose
