# Builds Storybook and the MCP server of the design system on every pull request, and puts both on
# https://ds.heerenveen.org from main, over SSH like acceptance.yml does: the static files in the document root, and the
# server as a small Node.js app next to it that answers https://ds.heerenveen.org/mcp. A push to main only starts this
# workflow when it changes something they are made of (the paths below), so a merge that only touches apps/site or docs/
# deploys nothing. docs/designsysteem-publiceren.md says what the owner sets up on the host and in GitHub. Until the
# secrets are there, the build still runs and the copy is skipped with a notice.

name: Storybook

on:
  pull_request:
  # The paths filter is on the push trigger only. On the workflow as a whole it would also stop the pull request build,
  # and the rule for main requires the check Build Storybook on every pull request.
  push:
    branches: [main]
    paths:
      - packages/design-system/**
      - apps/design-system-mcp/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/storybook.yml
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so an older build can't deploy over a newer one.
# Pull requests cancel their older run; main lets a running deployment finish: a half-copied folder would break the site.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    # Rules for main can require this check by its name, so rename it there too.
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter design-system build-storybook

      # The build must keep light-dark() as it is. If lightningcss rewrites it to --lightningcss-light and
      # --lightningcss-dark, a story with its own data-theme keeps the light tokens (see viteFinal in main.ts).
      - name: Check that light-dark() is kept
        run: "! grep -rq -e '--lightningcss' packages/design-system/storybook-static/assets --include='*.css'"

      # The pages keep out of search results with this tag (see noindex.ts). The deploy copies this build, so a build
      # without it must not go live.
      - name: Check that the pages have noindex
        run: |
          for file in index.html iframe.html; do
            grep -q '<meta name="robots" content="noindex">' "packages/design-system/storybook-static/$file" \
              || { echo "::error title=Storybook check failed::$file has no robots noindex tag."; exit 1; }
          done

      # The deploy job copies this build, so what goes live is what was checked here. On a pull request it is the
      # build to download and look at.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: storybook
          path: packages/design-system/storybook-static
          retention-days: 7

      # The MCP server is one file. The smoke test starts it twice, next to the Storybook build we just made and laid out
      # like the host, and asks both what an agent asks: initialize, the tools, docs-list for every component of the
      # build, and docs-show for one. An app that doesn't start or can't read these manifests never gets copied.
      - name: Build the MCP server and check it against the Storybook build
        run: |
          pnpm --filter @fansite/design-system-mcp build
          pnpm --filter @fansite/design-system-mcp smoke "$GITHUB_WORKSPACE/packages/design-system/storybook-static"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: design-system-mcp
          path: apps/design-system-mcp/dist
          retention-days: 7

  deploy:
    # Only main and a manual run on main publish; pull requests stop after the build.
    if: github.ref == 'refs/heads/main'
    name: Deploy to ds.heerenveen.org
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: designsystem
      url: https://ds.heerenveen.org
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook
          path: ${{ runner.temp }}/storybook

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: design-system-mcp
          path: ${{ runner.temp }}/design-system-mcp

      - id: secrets
        name: Check the secrets
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for name in DEPLOY_PATH SSH_HOST SSH_KNOWN_HOSTS SSH_PRIVATE_KEY SSH_USER; do
            if [ -z "${!name}" ]; then
              echo "::notice title=Deploy skipped::$name is not set in the environment designsystem. See docs/designsysteem-publiceren.md."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # rsync --delete empties the folder it copies to, so a wrong path must stop the run, not copy. Only the document
          # root of this subdomain is allowed: absolute, without .., and ending in /domains/ds.heerenveen.org/public_html.
          if ! printf '%s\n' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+/domains/ds\.heerenveen\.org/public_html$' \
            || printf '%s\n' "$DEPLOY_PATH" | grep -Fq '..'; then
            echo "::error title=Deploy stopped::DEPLOY_PATH in the environment designsystem is not the document root of ds.heerenveen.org (an absolute path that ends in /domains/ds.heerenveen.org/public_html). See docs/designsysteem-publiceren.md."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # An empty or half-downloaded build would make --delete empty the document root.
      - name: Check that the build is there
        if: steps.secrets.outputs.ready == 'true'
        env:
          BUILD: ${{ runner.temp }}/storybook
        run: |
          for file in index.html iframe.html index.json manifests/components.json; do
            if [ ! -s "$BUILD/$file" ]; then
              echo "::error title=Deploy stopped::The build has no $file, so nothing is copied."
              exit 1
            fi
          done
          jq -e '.entries | length > 0' "$BUILD/index.json" > /dev/null
          jq -e '.components | length > 0' "$BUILD/manifests/components.json" > /dev/null
          if [ ! -s "$RUNNER_TEMP/design-system-mcp/server.mjs" ]; then
            echo "::error title=Deploy stopped::The build of the MCP server has no server.mjs, so nothing is copied."
            exit 1
          fi

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/designsystem_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # --delete removes files that are gone from the build. .well-known/ holds the files that renew the certificate, and
      # .htaccess and cgi-bin/ are the host's own, so they stay. So does /mcp/, in case the host makes a folder in the
      # document root for the app that answers that address: Storybook has no file there, and the app's own folder is not
      # in the document root, so this copy never touches the app.
      - name: Copy the Storybook build to the host
        if: steps.secrets.outputs.ready == 'true'
        env:
          BUILD: ${{ runner.temp }}/storybook
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -rltz --delete --chmod=D755,F644 --exclude=/.well-known/ --exclude=/.htaccess --exclude=/cgi-bin/ --exclude=/mcp/ \
            -e "ssh -p 26 -i $HOME/.ssh/designsystem_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "$BUILD/" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      # The two files the MCP server and every link rely on. Each must answer 200 and be the file of this
      # build. The check tries for a minute, in case the host serves an old copy for a moment.
      - name: Check ds.heerenveen.org
        if: steps.secrets.outputs.ready == 'true'
        env:
          BUILD: ${{ runner.temp }}/storybook
        run: |
          check() {
            local file="$1" status
            status=$(curl --silent --max-time 10 --output "$RUNNER_TEMP/served.json" --write-out '%{http_code}' "https://ds.heerenveen.org/$file" || true)
            [ "$status" = 200 ] \
              && jq -S . "$RUNNER_TEMP/served.json" > "$RUNNER_TEMP/served.sorted.json" \
              && jq -S . "$BUILD/$file" > "$RUNNER_TEMP/built.sorted.json" \
              && cmp -s "$RUNNER_TEMP/served.sorted.json" "$RUNNER_TEMP/built.sorted.json"
          }
          for file in index.json manifests/components.json; do
            deadline=$((SECONDS + 60))
            until check "$file"; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error title=Storybook check failed::https://ds.heerenveen.org/$file does not answer 200 with the file of this build. See docs/designsysteem-publiceren.md."
                exit 1
              fi
              echo "https://ds.heerenveen.org/$file is not the file of this build yet."
              sleep 5
            done
            echo "https://ds.heerenveen.org/$file is the file of this build."
          done

      # The app lives in domains/ds.heerenveen.org/mcp, next to the document root and not in it, so this copy and the one
      # above never touch each other's files. There is no secret for it: the folder is made from DEPLOY_PATH, which
      # "Check the secrets" has limited to the document root of ds.heerenveen.org, and it is checked again here against
      # the one folder it may be, because --delete empties the folder it copies to. tmp/ holds the restart file of the
      # host, stderr.log its log of the app, and the host may put a .htaccess or a node_modules link there.
      - name: Copy the MCP server to the host
        if: steps.secrets.outputs.ready == 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          app_path="${DEPLOY_PATH%/public_html}/mcp"
          if ! printf '%s\n' "$app_path" | grep -Eq '^/[A-Za-z0-9._/-]+/domains/ds\.heerenveen\.org/mcp$' \
            || printf '%s\n' "$app_path" | grep -Fq '..'; then
            echo "::error title=Deploy stopped::The folder of the MCP server is not domains/ds.heerenveen.org/mcp. See docs/designsysteem-publiceren.md."
            exit 1
          fi
          rsync -rltz --delete --chmod=D755,F644 --exclude=/tmp/ --exclude=/stderr.log --exclude=/.htaccess --exclude=/node_modules \
            -e "ssh -p 26 -i $HOME/.ssh/designsystem_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "$RUNNER_TEMP/design-system-mcp/" "$SSH_USER@$SSH_HOST:$app_path/"
          # The host starts the app again when tmp/restart.txt changes.
          ssh -p 26 -i "$HOME/.ssh/designsystem_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "mkdir -p $(printf '%q' "$app_path")/tmp && touch $(printf '%q' "$app_path")/tmp/restart.txt"

      # The check is a script of the repository: it asks https://ds.heerenveen.org/mcp what an agent asks, and compares the
      # answers with the manifests of this build. It needs no secret and no dependency, so it runs without them.
      - name: Get the check
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            apps/design-system-mcp/scripts

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # initialize, the list of tools, and docs-list must answer, and docs-list must name every component of this build.
      # The host starts the app on the first request after the restart, so the check tries for 90 seconds.
      - id: mcp-check
        name: Check ds.heerenveen.org/mcp
        if: steps.secrets.outputs.ready == 'true'
        env:
          BUILD: ${{ runner.temp }}/storybook
        run: node apps/design-system-mcp/scripts/check.js https://ds.heerenveen.org/mcp "$BUILD" 90

      # Only when that check failed: shows what is on the host, because the owner can't see its hidden
      # files in the file manager. The log of a run is public, so the script of the host prints no
      # owner, group or secret, and only the three Passenger lines of the .htaccess. host-report.js
      # then removes the account name from what it printed, errors of ssh included. The step only
      # reads, and it can't change the result: the run is red because of the check.
      - name: Show what is on the host
        if: failure() && steps.secrets.outputs.ready == 'true' && steps.mcp-check.outcome == 'failure'
        continue-on-error: true
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          HOST_REPORT_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          app_path="${DEPLOY_PATH%/public_html}/mcp"
          if ! printf '%s\n' "$app_path" | grep -Eq '^/[A-Za-z0-9._/-]+/domains/ds\.heerenveen\.org/mcp$' \
            || printf '%s\n' "$app_path" | grep -Fq '..'; then
            echo "::error title=Host report skipped::The folder of the MCP server is not domains/ds.heerenveen.org/mcp. See docs/designsysteem-publiceren.md."
            exit 1
          fi
          # The script is sent on stdin; the two paths, both checked above, are its only arguments.
          timeout 60 ssh -p 26 -i "$HOME/.ssh/designsystem_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "sh -s -- $(printf '%q' "$app_path") $(printf '%q' "$DEPLOY_PATH")" \
            < apps/design-system-mcp/scripts/host-report.sh 2>&1 \
            | node apps/design-system-mcp/scripts/host-report.js
