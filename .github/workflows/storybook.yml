# Builds Storybook on every pull request, and publishes it to GitHub Pages from main.

name: Storybook

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so an older build can't deploy over a newer one.
# Pull requests cancel their older run; main lets a running deployment finish.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    # Rules for main can require this check by its name, so rename it there too.
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter design-system build-storybook

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/design-system/storybook-static

  deploy:
    # Only main publishes; pull requests stop after the build.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
