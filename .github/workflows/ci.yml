# Lints, typechecks, tests and builds every pull request and main, in jobs that run side by side. The last job, "Lint,
# typecheck, test and build", waits for all the others and is the check that the rules for main require, so a pull
# request with a type error or a failing test can't be merged. docs/beslissingen.md (CI draait in parallelle jobs) says
# why it is built this way.
#
#   changes         decides which checks of the site and the stories run (scripts/ci-changes.js)
#   lint            lint
#   test            the migrations and the seed on an empty database, and pnpm test
#   stories         every story in Chrome with axe
#   build           typecheck and pnpm build, and the folder the host runs, which the next two jobs use
#   site            the site the way the host runs it, and axe and a few checks of our own on every page, in parts
#                   that each have their own database
#   check           the check that the rules for main require (scripts/ci-gate.js)

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. Pull requests cancel their older run. A manual run has its own group.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}

# next build would otherwise send anonymous telemetry to Vercel.
env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Decides whether the checks of the site and the check of the stories have to run, and says why in one line each. A pull
  # request that only changes documentation, the tooling for agents, the importer or the MCP server of the design system
  # skips the checks of the site, and nothing else does; the stories are checked when the design system or the tools that
  # test it change. A push to main, a manual run, a pull request with the label "volledige controle" and anything the
  # script doesn't know run everything. The jobs that depend on it are skipped with `if`, not the workflow with `paths`:
  # a required check that never reports blocks the merge. scripts/ci-changes.js has the rules, and the job "check"
  # fails when a job was skipped that should have run.
  changes:
    name: Decide which checks to run
    outputs:
      site: ${{ steps.changes.outputs.site }}
      stories: ${{ steps.changes.outputs.stories }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits. For a pull request that is the merge into main and main as it is now, which
          # scripts/ci-changes.js compares to see what the pull request changes.
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - id: changes
        run: node scripts/ci-changes.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  test:
    name: Migrate, seed and test
    env:
      # The database below. The tests make a database of their own on this server and drop it afterwards.
      DATABASE_URL: mysql://root@127.0.0.1:3306/fansite
    runs-on: ubuntu-latest
    # The same MariaDB version as locally (compose.yaml) and on the host. It's empty and gone after the run, so it has no
    # password.
    services:
      mariadb:
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: fansite
        image: mariadb:10.11
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-retries=20
          --health-timeout=5s
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      # The migrations must make the schema on an empty database, and the seed must run on it.
      - name: Migrate and seed an empty database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - run: pnpm test

  # Every story in Chrome with axe, once in light and once in dark. Playwright uses the Google Chrome that the runner
  # already has, as for the accessibility check below. It runs when the design system or the tools that test it change;
  # scripts/ci-changes.js decides.
  stories:
    if: needs.changes.outputs.stories != 'false'
    name: Check the stories with axe
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:stories

  # The typecheck and the build run on every change, one after the other because the build repeats the typecheck of the
  # site and finds it done. When the checks of the site run, the job also makes the folder that the host runs
  # (`assemble`) and hands it to the job site, so the site is built once.
  build:
    name: Typecheck and build
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # next build reuses what it compiled and optimised in an earlier run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          path: apps/site/.next/cache
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      - name: Assemble the folder the host runs
        if: needs.changes.outputs.site != 'false'
        run: pnpm --filter site assemble "$RUNNER_TEMP/site"

      - if: needs.changes.outputs.site != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          # The folder has a .next in it.
          include-hidden-files: true
          name: site
          path: ${{ runner.temp }}/site
          retention-days: 1

  # axe and a few checks of our own on every page, in light and dark, on the folder the build job made and against a
  # database with the seed. Each part has its own database, so the tests of one part never see the made-up data of
  # another. Playwright uses the Google Chrome that the runner already has (see playwright.config.ts), so there is no
  # browser to install: `playwright install --with-deps` fetched packages from an Ubuntu mirror that is sometimes so slow
  # it took ten minutes.
  site:
    if: needs.changes.outputs.site != 'false'
    name: Check the site (${{ matrix.part }})
    needs: [changes, build]
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/fansite
    runs-on: ubuntu-latest
    services:
      mariadb:
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: fansite
        image: mariadb:10.11
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-retries=20
          --health-timeout=5s
        ports:
          - 3306:3306
    strategy:
      fail-fast: false
      # Two parts of the tests of the chromium project, and the writing project in a part of its own, as it runs on its
      # database alone and nothing else sees the article it publishes. `--shard` on all projects does not work: the writing
      # project depends on the other one, and Playwright then keeps every test in the first part and runs none in the others
      # (with exit code 0). `--no-deps` stops the writing project from running the other one first. Every part is in the
      # list or the job check fails, and scripts/ci-e2e-report.js fails a part that ran no test.
      matrix:
        include:
          - args: --project=chromium --shard=1/2
            part: 1/2
          - args: --project=chromium --shard=2/2
            part: 2/2
          - args: --project=chromium-writing --no-deps
            part: writing and the host
            smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site

      # The site must also work the way the host runs it: from the standalone build, with its static files, and with search
      # engines kept out of acceptance. One part runs it, the one with the fewest tests.
      - name: Check the site the way the host runs it
        if: matrix.smoke
        run: pnpm --filter site smoke "$RUNNER_TEMP/site"

      - name: Check accessibility
        # $ARGS is not quoted on purpose: it is a few options.
        run: |
          SITE_FOLDER="$RUNNER_TEMP/site" pnpm test:a11y --reporter=list,json $ARGS
          node scripts/ci-e2e-report.js "$PLAYWRIGHT_JSON_OUTPUT_NAME"
        env:
          ARGS: ${{ matrix.args }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-report.json

  # The check that the rules for main require. It runs whatever the other jobs did, because GitHub counts a skipped job
  # as a pass and skips a job whose predecessor failed. scripts/ci-gate.js has the rules: every job must have passed,
  # and the jobs of the site and the stories must have passed or have been skipped on purpose by the job changes. A part
  # of the e2e tests that failed or didn't run fails the job site, and so this one. The name is the one in the rules for
  # main, so rename it there too.
  check:
    if: always()
    name: Lint, typecheck, test and build
    needs: [changes, lint, test, stories, build, site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: node scripts/ci-gate.js
        env:
          NEEDS: ${{ toJSON(needs) }}
