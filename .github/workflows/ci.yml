# Lints, typechecks, tests and builds every pull request and main. It's meant to be a required check on main, so a pull
# request with a type error can't be merged.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. Pull requests cancel their older run.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    env:
      # next build would otherwise send anonymous telemetry to Vercel.
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # The site must also work the way the host runs it: from the standalone build, with its static files, and with
      # search engines kept out of acceptance.
      - name: Check the site the way the host runs it
        run: |
          pnpm --filter site assemble "$RUNNER_TEMP/site"
          pnpm --filter site smoke "$RUNNER_TEMP/site"
