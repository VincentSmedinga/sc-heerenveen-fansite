# Lints, typechecks, tests and builds every pull request and main. It's meant to be a required check on main, so a pull
# request with a type error can't be merged.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. Pull requests cancel their older run.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    env:
      # The database below. The tests make a database of their own on this server and drop it afterwards.
      DATABASE_URL: mysql://root@127.0.0.1:3306/fansite
      # next build would otherwise send anonymous telemetry to Vercel.
      NEXT_TELEMETRY_DISABLED: '1'
    # The same MariaDB version as locally (compose.yaml) and on the host. It's empty and gone after the run, so it has no
    # password.
    services:
      mariadb:
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: fansite
        image: mariadb:10.11
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-retries=20
          --health-timeout=5s
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits. For a pull request that is the merge into main and main as it is now, which
          # scripts/ci-changes.js compares to see what the pull request changes.
          fetch-depth: 2
          persist-credentials: false

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      # Decides whether the two checks of the site below have to run, and says why in one line. A pull request that only
      # changes documentation, the tooling for agents, the importer or the MCP server of the design system skips them,
      # and nothing else does. A push to main, a manual run, a pull request with the label "volledige controle" and
      # anything the script doesn't know run everything. The other steps always run. The two steps are skipped with
      # `if`, not the workflow with `paths`: a required check that never reports blocks the merge, and a skipped step
      # doesn't. scripts/ci-changes.js has the rules.
      - name: Decide which checks of the site to run
        id: changes
        run: node scripts/ci-changes.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # The migrations must make the schema on an empty database, and the seed must run on it.
      - name: Migrate and seed an empty database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - run: pnpm test

      # Every story in Chrome with axe, once in light and once in dark. Playwright uses the Google Chrome that the runner
      # already has, as for the accessibility check below. It runs when the design system or the tools that test it
      # change; scripts/ci-changes.js decides.
      - name: Check the stories with axe
        if: steps.changes.outputs.stories != 'false'
        run: pnpm test:stories

      - run: pnpm build

      # The site must also work the way the host runs it: from the standalone build, with its static files, and with
      # search engines kept out of acceptance.
      - name: Check the site the way the host runs it
        if: steps.changes.outputs.site != 'false'
        run: |
          pnpm --filter site assemble "$RUNNER_TEMP/site"
          pnpm --filter site smoke "$RUNNER_TEMP/site"

      # axe and a few checks of our own on every page, in light and dark, on the folder the smoke test just checked and
      # against the database with the seed. Playwright uses the Google Chrome that the runner already has (see
      # playwright.config.ts), so there is no browser to install: `playwright install --with-deps` fetched packages from an
      # Ubuntu mirror that is sometimes so slow it took ten minutes.
      - name: Check accessibility
        if: steps.changes.outputs.site != 'false'
        run: SITE_FOLDER="$RUNNER_TEMP/site" pnpm test:a11y
