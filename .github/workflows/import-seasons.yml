# Reads every past season from a starting season on from Wikipedia into the database of the
# acceptance environment, the oldest first, by running `import.mjs --from-season <season>` on the
# host over SSH. Started by hand, with the first season as the only input. The loop is in the
# importer, which carries on after a season that fails and exits with 1 at the end if there was
# one. It uses the environment and the secrets of acceptance.yml, and
# docs/acceptatieomgeving.md says how to start it. Until the secrets are there, it skips the
# import with a notice, so the run stays green. For one season, use import-season.yml.

name: Import seasons

on:
  workflow_dispatch:
    inputs:
      season:
        description: The first season to read, such as 2020/21
        required: true
        type: string

permissions:
  contents: read

# The same group as acceptance.yml, so an import never runs next to a deploy, and a running one
# finishes. GitHub keeps one waiting run per group, so start the import again if a newer run
# took its place. This import is long, so a deploy waits for it to finish.
concurrency:
  cancel-in-progress: false
  group: acceptance

jobs:
  import:
    name: Import the seasons on acceptance
    runs-on: ubuntu-latest
    # A run for one season took 10 to 15 seconds in all, set-up included (15 runs on 1 November
    # 2026). From 2010/11 there are 16 seasons, which is about 4 minutes. 30 leaves room for a
    # slow Wikipedia.
    timeout-minutes: 30
    environment:
      name: acceptatie
      url: https://acc.sc.heerenveen.org
    steps:
      # The season is typed by a person, so it is checked before anything connects, and it
      # reaches the steps only through an environment variable, never in the text of a command.
      # The command itself refuses a season in the future, the current season (there is nothing
      # to read from it on) and two years that do not follow each other.
      - name: Check the season
        shell: bash
        env:
          SEASON: ${{ inputs.season }}
        run: |
          pattern='^[0-9]{4}/[0-9]{2}$'
          if [[ ! "$SEASON" =~ $pattern ]]; then
            echo "::error title=Season refused::The season must look like 2025/26."
            exit 1
          fi

      - id: secrets
        name: Check the secrets
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for name in DEPLOY_PATH SSH_HOST SSH_KNOWN_HOSTS SSH_PRIVATE_KEY SSH_USER; do
            if [ -z "${!name}" ]; then
              echo "::notice title=Import skipped::$name is not set in the environment acceptatie. See docs/acceptatieomgeving.md."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/acceptance_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Runs the importer as cron does on the host: the Node 24 of the hosting, by its full
      # path, and DATABASE_URL from the file in the home folder. The output goes to this log and
      # not to ~/fansite-import.log. ssh exits with the exit code of the command, so a refused
      # season, or one or more seasons that were not read, turns this step red after the others
      # were read. The path and the season go
      # through printf %q, so the remote shell reads them as one word each.
      - name: Import the seasons on the host
        if: steps.secrets.outputs.ready == 'true'
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SEASON: ${{ inputs.season }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -p 26 -i "$HOME/.ssh/acceptance_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "/opt/alt/alt-nodejs24/root/usr/bin/node --env-file=\"\$HOME/fansite-acceptatie.env\" $(printf '%q' "$DEPLOY_PATH")/apps/importer/import.mjs --from-season $(printf '%q' "$SEASON")"
