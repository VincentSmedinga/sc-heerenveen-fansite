<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Schild met Friese banen en een groot pompeblêd</title>
  <!--
    Icon for browser tabs, home screens and installed apps, on a 64 by 64 grid. It is not the logo made smaller: at 16
    pixels the leaf of the logo is four pixels wide, so here the leaf is bigger, the bands are fewer and wider, and the
    shield fills the grid. The leaf stays visible at 16 pixels, where one pixel is four units. Outside the shield the
    picture is transparent. The same drawing serves light and dark tabs: the white edge shows on dark, the blue border on
    light.

    Construction, with the axis at x = 32 and the shield of logo.svg at 0.37 of its size:
    - Shield: the centre line of the border, from y = 5.13 at the top to y = 58.41 at the tip. The arcs are those of the
      logo, so every radius is 0.37 of it (top r = 59.2, corners r = 5.92, sides r = 46.11).
    - Border: a 5.5-wide stroke on that line (blue-700), with a 2-wide white edge outside it, 9.5 wide in all. The
      logo has a gap between the border and the field; here it is left out, because it would be a quarter of a pixel.
      With its edge and the points of the stroke at the top and the tip, the shield runs from y = 0.3 to y = 63.7 and
      is 56.7 wide.
    - Bands: slope 1:2, as in the logo. The white band is 28 wide, centred on the line through (32, 30.29), as the band
      of the logo is centred 68 below the top of its shield. Stripes in blue-500.
    - Leaf: the pompeblêd of logo.svg, scaled 1.12, centroid at (31.18, 31.47), in red-600. It is 30.6 wide, a little
      over half the shield, where the leaf of the logo is 42% of it.
  -->
  <defs>
    <path id="hf-icon-shield" d="M32,5.13A59.2,59.2 0 0,0 11.12,13.09A5.92,5.92 0 0,0 8.32,18.12A46.11,46.11 0 0,0 32,58.41A46.11,46.11 0 0,0 55.68,18.12A5.92,5.92 0 0,0 52.88,13.09A59.2,59.2 0 0,0 32,5.13Z"/>
    <clipPath id="hf-icon-field"><use href="#hf-icon-shield"/></clipPath>
  </defs>
  <use href="#hf-icon-shield" fill="none" stroke="#fff" stroke-width="9.5"/>
  <g clip-path="url(#hf-icon-field)">
    <rect width="64" height="64" fill="#fff"/>
    <path d="M0,0H64V30.64L0,-1.36Z" fill="#3575c4"/>
    <path d="M0,29.94L64,61.94V64H0Z" fill="#3575c4"/>
  </g>
  <use href="#hf-icon-shield" fill="none" stroke="#07458e" stroke-width="5.5"/>
  <path d="M-3.489,11.129A16.143,16.143 0 0,1 -14,-4A7,8 0 0,1 -7,-12A6,8 0 0,1 -1,-5A1,1 0 1,0 1,-5A6,8 0 0,1 7,-12A7,8 0 0,1 14,-4A16.143,16.143 0 0,1 3.489,11.129A10,10 0 0,1 -3.489,11.129Z" fill="#c22826" transform="translate(31.18 31.47) scale(1.12) rotate(34.695)"/>
</svg>
